<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto Personal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

.fondo{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
}

.texto{
    position:absolute;
    top:20%;
    left:50%;
    transform:translateX(-50%);
    color:white;
    text-align:center;
    z-index:2;
}

.texto h1{
    font-size:4rem;
    text-shadow:0 0 20px #4f8cff;
}

.texto p{
    color:#9ebfff;
    margin-top:10px;
}

.panel{
    position:absolute;
    top:60%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;
    padding:40px;
    color:white;
    text-align:center;
    min-width:300px;
    z-index:2;
    box-shadow:0 0 30px rgba(79,140,255,0.3);
}

.panel h2{
    margin-bottom:10px;
}

.panel button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#4f8cff;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.panel button:hover{
    background:#6aa6ff;
    box-shadow:0 0 15px #4f8cff;
}
</style>
</head>
<body>

<div class="texto">
    <h1>MI PROYECTO</h1>
    <p>Interfaz futurista</p>
</div>

<div class="panel">
    <h2>Bienvenido</h2>
    <p>Sistema iniciado correctamente.</p>
    <button>Continuar</button>
</div>

</body>
</html>
